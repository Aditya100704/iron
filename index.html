<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<title>IRON — Shankar</title>
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRON">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230B0D10'/%3E%3Ctext x='90' y='118' font-family='Arial Black,Arial' font-weight='900' font-size='84' fill='%23F2C14E' text-anchor='middle'%3EIR%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0D10'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-weight='900' font-size='30' fill='%23F2C14E' text-anchor='middle'%3EIR%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0B0D10; --bg2:#101318; --surface:#14181D; --raised:#1C2128; --line:#262C34; --line2:#323944;
  --text:#E9E6DF; --muted:#8A9099; --dim:#5C636D;
  --gold:#F2C14E; --gold-ink:#1A1400; --green:#3DDC97; --red:#FF5C5C; --blue:#6BA6FF;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px; --pad:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;padding-top:var(--safe-t)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
input,select,textarea{background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
/* selected text: white digits on a deep theme amber (the bright gold is too light for white text) */
::selection{background:#946A00;color:#FFFFFF}
input::selection,textarea::selection{background:#946A00;color:#FFFFFF}
input,textarea{caret-color:var(--gold)}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
a{color:var(--gold)}

#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,rgba(11,13,16,0));padding:14px var(--pad) 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.12em;color:var(--muted)}
.brand b{color:var(--gold);font-weight:400}
.status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.status.ok .dot{background:var(--green)} .status.off .dot{background:var(--red)} .status.busy .dot{background:var(--gold)}
main{flex:1;padding:0 var(--pad) calc(120px + var(--safe-b))}

.dayhead{padding:2px 0 8px}
.daypick{position:relative;display:flex;align-items:center;gap:10px;cursor:pointer}
.daypick .dayname{flex:1;min-width:0}
.daypick .caret{flex:none;width:11px;height:11px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:translateY(-5px) rotate(45deg);margin-right:6px}
.daypick select{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;font-size:16px}
.daymeta .past{color:var(--gold);font-weight:600}
.dayhead .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px;min-height:38px}
.tag.jump{background:var(--line2);color:var(--text)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--raised);color:var(--gold);font-size:11px;letter-spacing:.12em;font-weight:600}
.tag.live{color:var(--green)}
.dayname{font-family:var(--display);font-size:46px;line-height:1;margin:0;color:var(--text);white-space:nowrap;overflow:hidden}
.dayswitch{position:relative;flex:none;margin-left:auto}
.dayswitch select{appearance:none;-webkit-appearance:none;padding:8px 30px 8px 12px;min-height:38px;border-radius:999px;background:var(--raised);border:1px solid var(--line2);font-weight:600;font-size:13px;letter-spacing:0;text-transform:none;max-width:140px;text-overflow:ellipsis;color:var(--text)}
.dayswitch:after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.daymeta{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:0 0 12px;flex-wrap:wrap}
.daymeta b{color:var(--text);font-weight:600}
.daymeta .clock{font-family:var(--mono);color:var(--green)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ex.done{border-color:#2A3A31}
.ex.extra{border-style:dashed}
.exhead{display:flex;align-items:center;gap:10px;padding:12px 12px 8px 14px}
.exhead .m{flex:1;min-width:0}
.exhead .muscle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.exhead .muscle .ss{color:var(--blue)} .exhead .muscle .opt{color:var(--dim)} .exhead .muscle .added{color:var(--green)}
.exname{font-weight:600;font-size:17px;margin-top:2px;display:flex;align-items:center;gap:8px;line-height:1.2}
.exname .swap{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);background:var(--raised)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:transparent;flex:none}
.iconbtn:active{background:var(--raised)}
.iconbtn.has{color:var(--gold)}
.prescribe{font-size:12px;color:var(--muted);padding:0 14px 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prescribe .plan{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-family:var(--mono);color:var(--text)}
.prescribe .plan b{color:var(--gold)}
.prescribe .note{color:var(--gold);opacity:.9}
.prescribe .over{color:var(--green)}
.prescribe .suggest{color:var(--blue);background:transparent;border:1px solid var(--line2);border-radius:7px;padding:3px 8px;font-size:12px}
.last{font-size:12px;color:var(--dim);padding:0 14px 10px;display:flex;gap:6px;flex-wrap:nowrap;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.last::-webkit-scrollbar{display:none}
.last .chip{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-family:var(--mono);color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.last .chip.best{border-color:#4a3d13;color:var(--gold)}
.sets{border-top:1px solid var(--line)}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 74px 30px;gap:8px;align-items:center;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:0}
.setrow .n{font-family:var(--display);font-size:20px;color:var(--dim);text-align:center}
.setrow.pr .n{color:var(--gold)}
.setrow.lc .n::after{content:'~';color:var(--muted);font-size:11px;margin-left:2px}
.setrow .ss{color:var(--gold);font-size:13px;margin-left:5px}
.setrow .pp{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}
.setrow .ss.hardtag{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono)}
.daymeta .clock{cursor:pointer;border-bottom:1px dotted var(--muted)}
.setrow .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;padding:8px 6px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;text-align:center;position:relative}
.setrow .val small{font-family:var(--body);font-size:10px;color:var(--dim);position:absolute;right:6px;bottom:3px;letter-spacing:.08em}
.setrow .rir{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;padding:6px 4px;background:var(--bg2);border:1px solid var(--line);border-radius:9px}
.setrow .rir.set{color:var(--text)}
.setrow .more{color:var(--dim);font-size:18px;text-align:center}
.setrow.ghost .val,.setrow.ghost .rir{border-style:dashed;color:var(--dim)}
.setrow .rest{position:absolute;left:-2px;top:-9px;font-size:9px;color:var(--dim);font-family:var(--mono);background:var(--surface);padding:0 3px;border-radius:4px}
.prflag{font-size:10px;letter-spacing:.14em;color:var(--gold-ink);background:var(--gold);border-radius:5px;padding:1px 5px;font-weight:600;margin-left:6px;vertical-align:middle}
.addset{display:flex;gap:8px;padding:10px 12px 12px;align-items:center}
.addset button.add{flex:1;height:48px;border-radius:11px;background:var(--raised);border:1px solid var(--line2);font-weight:600;font-size:15px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px}
.addset button.add:active{background:var(--line2)}
.addset button.add .plus{color:var(--gold);font-size:20px;line-height:1}
.addset .unit{height:48px;padding:0 14px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--muted)}
.addset .unit.lb{color:var(--blue)}
.addex{width:100%;height:54px;border-radius:14px;border:1px dashed var(--line2);color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 14px}
.addex .plus{color:var(--gold);font-size:22px}

.pad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:12px var(--pad) calc(14px + var(--safe-b));max-width:560px;margin:0 auto;box-shadow:0 -20px 60px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .22s ease}
.pad.open{transform:none}
.pad .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.pad .who b{color:var(--text);font-weight:600}
.pad .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad .field{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:8px 10px 6px;display:flex;flex-direction:column}
.pad .field:focus-within{border-color:var(--gold);background:#17150E;box-shadow:0 0 0 1px var(--gold) inset}
.pad .field .flabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:24px}
.unitbtn{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:none;padding:2px 10px;min-height:24px;border-radius:7px;background:var(--raised);border:1px solid var(--line2);color:var(--gold)}
.unitbtn.lb{color:var(--blue);border-color:#2d4262}
.pad .partrow{display:flex;align-items:center;gap:6px;margin-top:10px}
.pad .partrow .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pad .partrow input{width:64px;min-height:38px;height:38px;padding:0;text-align:center;font-family:var(--mono);font-size:18px;background:var(--bg2);border:1px solid var(--line);border-radius:9px}
.pad .partrow .step{width:34px;height:34px}
.pad .partrow .hint{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .padnote{width:100%;margin-top:10px;min-height:0;height:42px;padding:8px 12px;font-size:14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.pad .field .row{display:flex;align-items:center;gap:6px}
.pad .field input{border:0;background:transparent;padding:0;font-size:30px;font-family:var(--display);letter-spacing:0;flex:1 1 0;min-width:0;width:auto;min-height:0;height:44px;color:var(--text);text-align:center;appearance:textfield;-moz-appearance:textfield}
.pad .field input::-webkit-outer-spin-button,.pad .field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pad .field{min-width:0}
.pad .field .step{width:34px;height:38px;border-radius:10px;background:var(--raised);color:var(--muted);font-size:20px;display:grid;place-items:center;flex:none}
.pad .field .step:active{background:var(--line2);color:var(--text)}
.rirrow{display:flex;gap:6px;margin-top:10px;align-items:center}
.rirrow .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);width:52px;height:38px;flex:none;border-radius:9px;background:var(--raised);border:1px solid var(--line2);font-weight:600}
.rirrow .chips{display:flex;gap:6px;flex:1}
.chip.hardq{flex:1.4;font-size:12px}
.chip{flex:1;height:38px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);font-family:var(--mono);font-size:14px;color:var(--muted);display:grid;place-items:center}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.pad .actions{display:flex;gap:10px;margin-top:12px}
.pad .actions .log{flex:1;height:54px;border-radius:13px;background:var(--gold);color:var(--gold-ink);font-weight:600;font-size:17px;letter-spacing:.02em}
.pad .actions .cancel{width:54px;height:54px;border-radius:13px;background:var(--raised);color:var(--muted);font-size:22px}
.pad .hint{font-size:12px;color:var(--dim);margin-top:8px;min-height:16px}
.pad .hint b{color:var(--gold);font-weight:600}

.fab{position:fixed;right:max(16px,calc(50% - 280px + 16px));bottom:calc(18px + var(--safe-b));z-index:30;width:56px;height:56px;border-radius:50%;background:var(--raised);border:1px solid var(--line2);color:var(--text);font-size:26px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.finish{position:fixed;left:max(16px,calc(50% - 280px + 16px));bottom:calc(18px + var(--safe-b));z-index:30;height:56px;padding:0 20px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;align-items:center;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line2);padding:8px var(--pad) calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .24s ease;max-height:88dvh;overflow:auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 14px}
.sheet h3{font-family:var(--display);font-size:26px;margin:4px 0 10px;letter-spacing:.03em}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.menu button:active{background:var(--line2)}
.menu button .t{font-weight:600;font-size:15px}
.menu button .s{font-size:12px;color:var(--muted)}
.menu button .ic{color:var(--gold);font-size:18px}

.page{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .22s ease;padding-bottom:calc(30px + var(--safe-b))}
.page.open{transform:none}
.page .bar{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;gap:8px;padding:calc(12px + var(--safe-t)) 10px 10px;border-bottom:1px solid var(--line)}
.page .bar .back{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.page .bar h2{font-family:var(--display);font-size:28px;margin:0;flex:1;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .bar .act{padding:0 14px;height:40px;border-radius:10px;background:var(--gold);color:var(--gold-ink);font-weight:600;white-space:nowrap}
.page .bar .act.ghost{background:var(--raised);color:var(--text)}
.page .body{max-width:560px;margin:0 auto;padding:14px var(--pad)}
.section{margin-bottom:22px}
.section h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.list .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.list .item .m{flex:1;min-width:0}
.list .item .t{font-weight:600;font-size:15px}
.list .item .s{font-size:12px;color:var(--muted);margin-top:2px}
.list .item .v{font-family:var(--mono);font-size:14px;color:var(--text);text-align:right;white-space:nowrap}
.list .item.click:active{background:var(--raised)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kv .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv .tile .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv .tile .v{font-family:var(--display);font-size:30px;margin-top:2px;line-height:1}
.kv .tile .v small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-left:4px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.chartbox .cap{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.chartbox canvas{width:100%!important;height:200px!important}
.segs{display:flex;gap:6px;margin-bottom:12px;overflow:auto;padding-bottom:2px}
.segs button{padding:8px 12px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.segs button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.form .row{display:flex;gap:8px}
.form .row>*{flex:1}
.btn{height:46px;border-radius:11px;background:var(--raised);border:1px solid var(--line2);font-weight:600;padding:0 16px}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.red{color:var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.empty{color:var(--dim);font-size:14px;padding:30px 10px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.gold{background:var(--gold);color:var(--gold-ink)}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:end center;background:rgba(0,0,0,.6);padding:0;opacity:0;pointer-events:none;transition:opacity .15s}
.modal.on{opacity:1;pointer-events:auto}
.modal .box{background:var(--surface);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:16px var(--pad) calc(16px + var(--safe-b));width:100%;max-width:560px;max-height:86dvh;overflow:auto}
.modal .box h3{margin:0 0 10px;font-family:var(--display);font-size:24px;letter-spacing:.03em}

async function flushQueue(){
  if(!state.queue.length) return;
  const q=[...state.queue]; state.queue=[];
  for(const op of q){
    try{
      if(op.t==='set.insert') await api.post('sets',[op.row]);
      else if(op.t==='set.delete') await api.del('sets','id=eq.'+op.id);
      else if(op.t==='set.update') await api.patch('sets','id=eq.'+op.id, op.body);
      else if(op.t==='wo.insert') await api.post('workouts',[op.row]);
      else if(op.t==='wo.update') await api.patch('workouts','id=eq.'+op.id, op.body);
      else if(op.t==='plan.upsert') await api.post('plans',[op.row],'resolution=merge-duplicates,return=minimal');
      else if(op.t==='plan.delete') await api.del('plans','id=eq.'+op.id);
      else if(op.t==='ex.upsert') await api.post('exercises',[op.row],'resolution=merge-duplicates,return=minimal');
      else if(op.t==='photo.insert') await api.post('photos',[op.row]);
      else if(op.t==='photo.delete') await api.del('photos','id=eq.'+op.id);
      else if(op.t==='rec.insert') await api.post('recovery',[op.row]);
      else if(op.t==='note.read') await api.patch('coach_notes','id=eq.'+op.id,{read_at:op.at});
      else if(op.t==='setting.upsert') await api.post('settings',[op.row],'resolution=merge-duplicates,return=minimal');
      else if(op.t==='meal.insert') await api.post('meals',[op.row]);
      else if(op.t==='meal.delete') await api.del('meals','id=eq.'+op.id);
      else if(op.t==='food.upsert') await api.post('food_items',[op.row],'resolution=merge-duplicates,return=minimal');
      else if(op.t==='body.upsert') await api.post('body_metrics',[op.row],'resolution=merge-duplicates,return=minimal');
      else if(op.t==='health.daily') await api.post('health_daily',op.rows,'resolution=merge-duplicates,return=minimal');
      else if(op.t==='health.session') await api.post('health_sessions',op.rows,'resolution=merge-duplicates,return=minimal');
    }catch(e){ console.warn('queue op failed', op.t, e); state.queue.push(op); }
  }
  persist();
}

const activePlan = () => state.plans.find(p=>p.active) || state.plans[0] || {id:DEFAULT_PLAN.id,name:DEFAULT_PLAN.name,data:DEFAULT_PLAN,active:true};
const exInfo = name => state.exercises.find(e=>e.name===name) || {name, muscle:'Other', unit:/dumb/i.test(name)?'lb':'kg'};
const exUnit = name => state.settings.units[name] || exInfo(name).unit || 'kg';
function exSets(name){ return state.sets.filter(s=>s.exercise===name && s.reps>0); }
// Halperin 2022: self-reported RIR is ~1 rep off, worse on long sets and far from failure. His threshold: over 15 reps at RIR 3+ = low-confidence effort.
const partialsOf = c => { const m=/(?:^|\s)p(\d+)(?:\s|$)/.exec(c||''); return m?+m[1]:0; };
const mkComment = (hard, partials) => [hard?'hard?':'', partials>0?'p'+partials:''].filter(Boolean).join(' ')||null;
const lowConf = (reps, rir) => +reps>15 && rir!=null && +rir>=3;
function exBest(name, unit, excludeId){ let best={e1:0,w:0,set:null,repsAt:{}}; for(const s of exSets(name)){ if(s.unit!==unit) continue; if(excludeId && s.id===excludeId) continue; if(lowConf(s.reps,s.rir)) continue; const w=+s.weight, r=+s.reps; const e=e1rm(w,r); if(e>best.e1 || (e===best.e1 && best.set && r>+best.set.reps)){best.e1=e;best.set=s;} if(w>best.w) best.w=w; const k=fmtW(w); if(!(k in best.repsAt)||r>best.repsAt[k]) best.repsAt[k]=r; } return best; }
// FitNotes-style PR: e1RM best, OR heaviest weight ever, OR most reps ever at a weight lifted before.
function prKind(name, unit, w, r, excludeId, rir){ if(lowConf(r,rir)) return null; const b=exBest(name,unit,excludeId); if(!r||!w) return null; const e=e1rm(w,r); if(!b.set) return 'first'; if(e>b.e1) return 'e1rm'; if(w>b.w) return 'weight'; const k=fmtW(w); if(k in b.repsAt && r>b.repsAt[k]) return 'reps'; return null; }
const isPR = kind => !!kind && kind!=='first';
function exLastSessions(name, n=3, beforeDate){ const by={}; for(const s of exSets(name)){ if(beforeDate && s.date>=beforeDate) continue; (by[s.date]=by[s.date]||[]).push(s);} return Object.keys(by).sort().reverse().slice(0,n).map(d=>({date:d,sets:by[d].sort((a,b)=>(a.set_no||0)-(b.set_no||0))})); }
function curDate(){ return state.viewDate||todayISO(); }
const SESSION_GAP = 60*60*1000; // a set more than an hour after the last one starts a new session
const isoOf = x => x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
function daySets(d){ return state.sets.filter(s=>s.date===d).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')); }
// Superset detection from timestamps: A-B-A within 4 minutes, or two different exercises logged within 90 s of each other.
function supersetMap(sets){ const m={}; const t=x=>new Date(x.created_at||0).getTime(); for(let i=1;i<sets.length;i++){ const a=sets[i-1], b=sets[i]; if(a.exercise!==b.exercise && (t(b)-t(a))/1000<=90){ m[a.id]=b.exercise; m[b.id]=a.exercise; } if(i<sets.length-1){ const c=sets[i+1]; if(a.exercise!==b.exercise && a.exercise===c.exercise && (t(b)-t(a))/1000<=240 && (t(c)-t(b))/1000<=240){ m[a.id]=b.exercise; m[b.id]=a.exercise; m[c.id]=b.exercise; } } } return m; }
function isSupersetNow(){ const ss=sessionSets(); if(ss.length<2) return false; const m=supersetMap(ss); return !!m[ss[ss.length-1].id]; }
function avgRest(name){ const xs=exSets(name); const byDay={}; xs.forEach(x=>(byDay[x.date]=byDay[x.date]||[]).push(x)); let rests=[]; Object.keys(byDay).forEach(d=>{ const ds=daySets(d); const m=supersetMap(ds); byDay[d].forEach(x=>{ if(!m[x.id] && x.rest_s>=15 && x.rest_s<=600) rests.push(+x.rest_s); }); }); if(!rests.length) return null; rests.sort((a,b)=>a-b); return {median:rests[Math.floor(rests.length/2)], n:rests.length}; }
function parseNotes(w){ try{ return w&&w.note?JSON.parse(w.note):{}; }catch(e){ return {}; } }
function workoutFor(d){
  const ws=state.workouts.filter(w=>w.date===d); if(!ws.length) return null;
  if(d===todayISO() && state.session){ const s=ws.find(w=>w.id===state.session.workoutId); if(s) return s; }
  const withSets=ws.filter(w=>state.sets.some(s=>s.workout_id===w.id));
  return (withSets.length?withSets:ws).sort((a,b)=>(b.started_at||'').localeCompare(a.started_at||''))[0];
}
function notesFor(d){ if(d===todayISO() && state.session && state.session.date===d) return state.session.notes||{}; return parseNotes(workoutFor(d)); }
function weekStartISO(d){ const x=new Date((d||todayISO())+'T00:00'); x.setDate(x.getDate()-((x.getDay()+6)%7)); return isoOf(x); }
function addDaysISO(d,n){ const x=new Date(d+'T00:00'); x.setDate(x.getDate()+n); return isoOf(x); }
function nextDayKey(plan, d){
  const days=plan.data.days; if(!days.length) return null; d=d||curDate();
  if(d===todayISO() && state.session && state.session.date===d && days.some(x=>x.key===state.session.dayKey)) return state.session.dayKey;
  const w=workoutFor(d); if(w && days.some(x=>x.key===w.day_key)) return w.day_key;

  if(!last) return days[0].key;

}
const DEFAULT_FOCUS={Chest:20, Triceps:18, Abs:15};
const focusOf = plan => plan.data.focus ? plan.data.focus : DEFAULT_FOCUS;
function planSlotRef(slot){ const m=/^([^:]+):(\d+)$/.exec((slot&&slot.key)||''); if(!m) return null; const plan=activePlan(); const day=plan.data.days.find(d=>d.key===m[1]); return day && day.slots[+m[2]] ? {plan, day, idx:+m[2], slot:day.slots[+m[2]]} : null; }
function recoveryFor(d, muscle){ const r=(state.recovery||[]).filter(x=>x.date===d && x.muscle===muscle).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')); return r.length ? r[r.length-1].status : null; }
function slotsFor(day){
  const d=curDate(); const extra=(state.settings.extra[d]||{})[day.key]||[];
  const slots=day.slots.map((s,i)=>({...s, key:day.key+':'+i})).concat(extra.map((e,j)=>({...e, key:day.key+':x'+j, extra:true})));
  // not recovered: the last slot of that muscle loses a set today
  const lastOf={}; slots.forEach((s,i)=>{ lastOf[s.muscle]=i; });
  for(const m in lastOf){ if(recoveryFor(d,m)==='not') slots[lastOf[m]].recCut=true; }
  const shown=new Set(slots.map(slotExercise)); const ds=daySets(d);
  const logged=[...new Set(ds.map(s=>s.exercise))].filter(n=>!shown.has(n));
  return slots.concat(logged.map(n=>({muscle:exInfo(n).muscle, sets:ds.filter(s=>s.exercise===n).length, reps:'', primary:n, alts:[], key:'logged:'+n, logged:true})));
}
function slotExercise(slot){ if(slot.logged) return slot.primary; const today=(state.settings.swapsDay[curDate()]||{})[slot.key]; return today || state.settings.swaps[slot.key] || slot.primary; }
function volAdj(key){ return ((state.volume&&state.volume.adjust)||{})[key]||0; }

const incFor = unit => unit==='lb' ? 5 : 2.5;
function repRange(slot){ const m=String(slot.reps||'').match(/(\d+)\s*[-–]\s*(\d+)/); if(m) return [+m[1],+m[2]]; const n=parseInt(slot.reps,10); return n?[n,n]:[8,12]; }
function targetFor(slot, name, unit, D){

  if(!sessions.length) return null;
  const last=sessions[0].sets;
  const working=last.filter(x=>+x.reps>=lo); // the working weight is the heaviest weight that reached the bottom of the range
  const topW=Math.max(...(working.length?working:last).map(x=>+x.weight||0));

  else if(reps0.every(r=>r>=hi)){ w=topW+inc; reps=[lo]; why=`every set hit ${hi}+ at ${fmtW(topW)} · +${inc} ${unit}`; }

    if(p && p.length && Math.max(...p.map(x=>+x.reps))<lo && topW-inc>0){ w=topW-inc; reps=[lo]; why=`under ${lo} reps twice at ${fmtW(topW)} · −${inc} ${unit}`; }
    else { reps=reps0.map(r=>r+1); why=`under ${lo} last time · same weight, one more rep`; }
  }
  else { reps=reps0.map(r=>Math.min(hi,r+1)); why=`inside ${lo}–${hi} last time · same weight, one more rep`; }

  else if(rec==='partial' && w>topW){ w=topW; reps=reps0.map(r=>Math.min(hi,r)); why=`partly recovered · hold ${fmtW(topW)} today`; }

}
function targetSet(t,k){ if(!t) return null; return {w:t.w, r:t.reps[Math.min(k,t.reps.length-1)]}; }

/* ================= PLATEAU ================= */
function sessionBests(name, unit, n){ return exLastSessions(name,n).map(s=>{ const xs=s.sets.filter(x=>x.unit===unit && !lowConf(x.reps,x.rir)); return {date:s.date, e:xs.length?Math.max(...xs.map(x=>e1rm(+x.weight,+x.reps))):0, pr:xs.some(x=>x.is_pr)}; }).filter(x=>x.e>0); }

function trendUp(name){ const b=sessionBests(name, exUnit(name), 2); return b.length===2 && b[0].e>b[1].e; }
function platActive(name){ const p=plateauOf(name); if(!p) return null; return state.settings.platDismiss[name]===p.last ? null : p; }

/* ================= VOLUME · specialization ================= */
// Fractional counting (Pelland et al. 2025, Sports Med): a direct set is 1.0 for its muscle, an indirect set is 0.5 for the helpers.
// Rules by name; a per-exercise override lives in settings.secondary[name] = {Muscle: weight}.
function contribOf(name, muscle){
  const ov=(state.settings.secondary||{})[name]; if(ov && Object.keys(ov).length) return ov;
  const n=(name||'').toLowerCase(); const c={}; if(muscle) c[muscle]=1;
  if(muscle==='Chest' && /press|dip|push|bench/.test(n)){ c.Triceps=.5; c.Shoulders=.5; }
  if(muscle==='Shoulders' && /press|pike|handstand/.test(n)) c.Triceps=.5;
  if(muscle==='Back' && /row|pull|chin|lat |lat$|pulldown/.test(n)) c.Biceps=.5;
  if(muscle==='Triceps' && /close[- ]grip|jm press|dip/.test(n)) c.Chest=.5;
  if(muscle==='Biceps' && /chin/.test(n)) c.Back=.5;
  return c;
}
const fmtN = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
function tierOf(n){ return n<4?'below minimum':n<11?'4-10':n<19?'11-18':n<30?'19-29':'30+'; }
// Hard set = RIR logged and ≤3, OR marked "hard, unsure", OR (no RIR) within reach of the recent best on that lift:
// each rep is ~3% of e1RM (Epley), so ≥90% of the 8-week best e1RM ≈ RIR 3 or closer; for sets over 12 reps, ≥85% of the best reps at that weight.
function inferredHard(s){
  const since=addDaysISO(s.date,-56); const xs=exSets(s.exercise).filter(x=>x.unit===s.unit && x.date>=since && x.date<=s.date && +x.reps>0);
  if(+s.reps>12){ const w=fmtW(s.weight); const best=Math.max(0,...xs.filter(x=>fmtW(x.weight)===w).map(x=>+x.reps)); return best>0 && +s.reps>=0.85*best; }
  const bestE=Math.max(0,...xs.filter(x=>!lowConf(x.reps,x.rir)).map(x=>e1rm(+x.weight,+x.reps))); return bestE>0 && e1rm(+s.weight,+s.reps)>=0.9*bestE;
}
function isHard(s){ if(!(+s.reps>0)) return false; if(s.rir!=null) return +s.rir<=3; if((s.comment||'').includes('hard?')) return true; return inferredHard(s); }
function hardSetsWeek(muscle, wk){ const end=addDaysISO(wk,7); let t=0; for(const s of state.sets){ if(s.date<wk || s.date>=end || !isHard(s)) continue; const w=contribOf(s.exercise, s.muscle)[muscle]; if(w) t+=w; } return Math.round(t*10)/10; }
function plannedWeekly(plan, muscle){ return Math.round(10*plan.data.days.reduce((a,d)=>a+d.slots.reduce((b,s,i)=>{ const w=contribOf(slotExercise(s), s.muscle)[muscle]||0; return b+(w?Math.max(1,(s.sets||3)+volAdj(d.key+':'+i))*w:0); },0),0))/10; }
function pickSlot(plan, muscle, delta){
  let best=null;
  plan.data.days.forEach(d=>d.slots.forEach((s,i)=>{ if(s.muscle!==muscle) return; const key=d.key+':'+i; const n=(s.sets||3)+volAdj(key);
    if(delta>0 && n>=6) return; if(delta<0 && n<=1) return;
    if(!best || (delta>0 ? n<best.n : n>best.n)) best={key,n}; }));
  return best && best.key;
}
// Every Monday: focus muscles that were fully recovered at every session and didn't stall gain a set; any muscle with a "not" or two "partly" loses one.
function volumeRollover(){
  const plan=activePlan(); const wk=weekStartISO(); const V=state.volume||{};
  if(V.week===wk) return;
  const prev=addDaysISO(wk,-7); const inPrev=d=>d>=prev && d<wk; const focus=focusOf(plan);
  const muscles=[...new Set(plan.data.days.flatMap(d=>d.slots.map(s=>s.muscle)))];
  const adjust={...(V.adjust||{})}; state.volume={...V, adjust};
  const changes=[];
  if(V.week){ // the very first run only records the week
    for(const m of muscles){
      if(!state.sets.some(s=>s.muscle===m && inPrev(s.date))) continue;
      const ans=state.recovery.filter(r=>r.muscle===m && inPrev(r.date)).map(r=>r.status);
      const not=ans.filter(a=>a==='not').length, part=ans.filter(a=>a==='partial').length, full=ans.filter(a=>a==='full').length;

function undoVolume(id){ const c=((state.volume&&state.volume.log)||[]).find(x=>x.id===id); if(!c||c.undone) return; state.volume.adjust[c.key]=(state.volume.adjust[c.key]||0)-c.delta; c.undone=true; persist(); enqueue({t:'setting.upsert', row:{key:'volume', value:state.volume}}); }
function deloadSuggested(){

const SOUNDS={
  none:[],
  chime:[[0,880,.15,'sine'],[.18,880,.15,'sine']],

  rising:[[0,523,.12,'square'],[.12,659,.12,'square'],[.24,784,.25,'square']],

/* ---- back button: every open layer is a history entry; popstate closes the top one ---- */
const LAYERS=[]; let pendingPops=0;
function pushLayer(kind, close, data, replace){ LAYERS.push({kind, close, data}); if(replace) history.replaceState({l:LAYERS.length},''); else history.pushState({l:LAYERS.length},''); }
function popLayers(n){ if(n<=0) return; for(let i=0;i<n;i++){ const l=LAYERS.pop(); if(l){ try{ l.close(); }catch(e){} } } pendingPops++; history.go(-n); }
function closeLayer(kind, all){ const ks=LAYERS.map(l=>l.kind); let i=all?ks.indexOf(kind):ks.lastIndexOf(kind); if(i<0) return; popLayers(LAYERS.length-i); }
window.addEventListener('popstate', e=>{ if(pendingPops>0){ pendingPops--; return; } const depth=(e.state&&e.state.l)||0; while(LAYERS.length>depth){ const l=LAYERS.pop(); try{ l.close(); }catch(x){} } });
try{ history.replaceState({l:0},''); }catch(e){}
function modal(title, body, acts){ if(!$('#modal').classList.contains('on')) pushLayer('modal', ()=>$('#modal').classList.remove('on')); $('#modalTitle').textContent=title; $('#modalBody').innerHTML=body; $('#modalActs').innerHTML=acts.map((a,i)=>`<button class="btn sm ${a.gold?'gold':''} ${a.red?'red':''}" data-i="${i}">${a.t}</button>`).join(''); $$('#modalActs button').forEach(b=>b.onclick=()=>{ const a=acts[+b.dataset.i]; if(a.fn) a.fn(); if(!a.keep) closeModal(); }); $('#modal').classList.add('on'); }
function closeModal(){ if($('#modal').classList.contains('on')) closeLayer('modal'); }
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
document.addEventListener('keydown', e=>{ const G=$('#gal'); if(!G.classList.contains('on')) return; const T=$('#galTrack'); if(e.key==='ArrowRight') T.scrollBy({left:T.clientWidth, behavior:'smooth'}); if(e.key==='ArrowLeft') T.scrollBy({left:-T.clientWidth, behavior:'smooth'}); if(e.key==='Escape') closeLayer('gallery'); });

async function rotatePhoto(id){

    PHOTO_SRC[id]='data:image/jpeg;base64,'+b64; const sl=[...$('#galTrack').children].find(e=>e.dataset.id===id); if(sl) sl.innerHTML=`<img src="${PHOTO_SRC[id]}" alt="">`; const th=$(`#pageBody img[data-src="${id}"]`); if(th) th.src=PHOTO_SRC[id];

// pinch-to-zoom + double-tap on the current slide; while zoomed the strip stops swiping so one finger pans the picture
function bindZoom(sl){
  const img=sl.querySelector('img'); if(!img || img.dataset.zoom) return; img.dataset.zoom='1';
  let scale=1, tx=0, ty=0, startD=0, startS=1, lastTap=0, panX=0, panY=0, panning=false; const T=$('#galTrack');
  const apply=()=>{ img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; img.style.transition='none'; const z=scale>1.02; T.style.overflowX = z ? 'hidden' : ''; T.style.scrollSnapType = z ? 'none' : ''; img.style.touchAction = z ? 'none' : 'pan-x pan-y pinch-zoom'; };
  const reset=()=>{ scale=1; tx=0; ty=0; apply(); img.style.transition='transform .15s'; };
  sl.addEventListener('touchstart', e=>{ if(e.touches.length===2){ startD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); startS=scale; } else if(e.touches.length===1 && scale>1){ panning=true; panX=e.touches[0].clientX-tx; panY=e.touches[0].clientY-ty; } }, {passive:true});
  sl.addEventListener('touchmove', e=>{ if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); scale=Math.min(5, Math.max(1, startS*d/startD)); apply(); e.preventDefault(); } else if(panning && e.touches.length===1){ tx=e.touches[0].clientX-panX; ty=e.touches[0].clientY-panY; apply(); e.preventDefault(); } }, {passive:false});
  sl.addEventListener('touchend', e=>{ panning=false; if(scale<1.05) reset(); if(e.touches.length===0 && e.changedTouches.length===1){ const now=Date.now(); if(now-lastTap<300){ if(scale>1) reset(); else { scale=2.5; const r=img.getBoundingClientRect(); const cx=e.changedTouches[0].clientX-(r.left+r.width/2), cy=e.changedTouches[0].clientY-(r.top+r.height/2); tx=-cx*1.5; ty=-cy*1.5; apply(); } lastTap=0; } else lastTap=now; } }, {passive:true});
}

$('#photoIn').onchange=async e=>{

};
function shrink(file, max, q){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q).split(',')[1]); }; img.onerror=rej; img.src=url; }); }

  $$('#pageBody [data-mdel]').forEach(b=>b.onclick=()=>{ const id=b.dataset.mdel; state.meals=state.meals.filter(m=>m.id!==id); persist(); enqueue({t:'meal.delete', id}); pageDiet(B,T,A); });
  $('#bwSave').onclick=()=>{ const w=$('#bwIn').value===''?null:+$('#bwIn').value; const wa=$('#waIn').value===''?null:+$('#waIn').value; const wn=$('#wnIn').value===''?null:+$('#wnIn').value; if(w==null&&wa==null&&wn==null) return; const row={date:D, weight:w, waist_above:wa, waist_at:wn}; const i=state.body.findIndex(b=>b.date===D); if(i>=0) state.body[i]={...state.body[i],...row}; else state.body.unshift(row); persist(); enqueue({t:'body.upsert', row}); toast(w!=null?`${w} kg saved`:'Saved'); };
  $$('#pageBody input[type=number]').forEach(i=>{ i.onfocus=()=>setTimeout(()=>i.select(),0); i.onclick=()=>i.select(); });
}
function logMeal(D, f, qty, note){
  const row={id:uid(), date:D, slot:dietSlot||f.slot, item:f.name, kcal:f.kcal, protein:f.protein, qty:qty||1, note:note||null, created_at:new Date().toISOString()};
  state.meals.push(row); f.uses=(f.uses||0)+1; f.last_used=D; persist();
  enqueue({t:'meal.insert', row}); enqueue({t:'food.upsert', row:{name:f.name, slot:f.slot, kcal:f.kcal, protein:f.protein, uses:f.uses, last_used:D}});
  const ms=mealsOn(D); const k=Math.round(ms.reduce((a,m)=>a+m.kcal*(+m.qty||1),0)); toast(`${f.name} · ${k.toLocaleString()} kcal today`);
}
function customFood(D, B,T,A){
  modal('Custom food', `<div class="form"><label>What<input id="cfName" autocapitalize="sentences" placeholder="e.g. Chicken hot pepper + 2 parottas"></label><div class="row"><label>Calories<input id="cfK" type="number" inputmode="numeric"></label><label>Protein g<input id="cfP" type="number" inputmode="numeric"></label></div><div class="row"><label>Meal<select id="cfSlot">${SLOTS.map(([k,l])=>`<option value="${k}" ${dietSlot===k?'selected':''}>${l}</option>`).join('')}</select></label><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="cfSave" checked style="min-height:0;width:20px;height:20px"> keep in my list</label></div></div>`,
    [{t:'Cancel'},{t:'Log',gold:true,fn:()=>{ const name=$('#cfName').value.trim(); const k=+$('#cfK').value, p=+$('#cfP').value||0; if(!name||!k) return; const slot=$('#cfSlot').value; dietSlot=slot; let f=state.foods.find(x=>x.name===name); if(!f){ f={name, slot:foodSlot(slot), kcal:k, protein:p, uses:0}; if($('#cfSave').checked) state.foods.push(f); } logMeal(D, f, 1, null); if(!$('#cfSave').checked){ /* one-off: still counted in the day, not kept */ } pageDiet(B,T,A); }}]);
  setTimeout(()=>$('#cfName').focus(),100);
}

/* ---- volume · specialization ---- */
function pageVolume(B,T,A){
  T.textContent='Volume'; const plan=activePlan(); const f=focusOf(plan); const wk=weekStartISO(); const V=state.volume||{};
  const muscles=[...new Set([...Object.keys(f), ...plan.data.days.flatMap(d=>d.slots.map(s=>s.muscle))])];
  const weeks=[3,2,1,0].map(i=>addDaysISO(wk,-7*i)); const since=addDaysISO(wk,-14);
  B.innerHTML = `<div class="empty" style="padding:0 0 14px;text-align:left">Fractional hard sets per week: a direct set counts 1, an indirect set counts 0.5 for the muscles it helps (a chest press adds 0.5 to triceps and shoulders, a row adds 0.5 to biceps). A set counts as hard when its RIR is 3 or closer, when it is marked “hard?”, or — with no RIR logged — when it lands within 90% of your best e1RM on that lift in the last 8 weeks (each rep is ~3% of e1RM, so that is RIR 3 or closer); sets over 12 reps count when they reach 85% of your best reps at that weight. Tiers from Pelland 2025: 4 is the minimum effective dose, then 5-10, 11-18, 19-29, 30+ with diminishing returns and no cliff. Every Monday a <b>focus</b> muscle gains a set if it was fully recovered at every session and nothing stalled. Any muscle loses a set after one “not recovered” or two “partly”.</div>
  ${muscles.map(m=>{ const isF=f[m]!=null; const counts=weeks.map(w=>hardSetsWeek(m,w)); const mx=Math.max(1,...counts,f[m]||0); const planned=plannedWeekly(plan,m);
    const rec=(state.recovery||[]).filter(r=>r.muscle===m && r.date>=since); const tally=['full','partial','not'].map(v=>rec.filter(r=>r.status===v).length);
    const rirs=state.sets.filter(s=>s.muscle===m && s.date>=since && s.rir!=null).map(s=>+s.rir); const avgRir=rirs.length?(rirs.reduce((a,b)=>a+b,0)/rirs.length).toFixed(1):'—';
    const lifts=[...new Set(state.sets.filter(s=>s.muscle===m && s.date>=since).map(s=>s.exercise))]; const up=lifts.filter(trendUp).length, flat=lifts.filter(n=>plateauOf(n)).length;
    const lastC=(V.log||[]).find(c=>c.muscle===m && !c.undone);
    return `<div class="vrow ${isF?'focus':''}"><div class="vh"><div><div class="t">${esc(m)}</div><div class="s">planned ${fmtN(planned)} a week${isF?' · target '+f[m]:''} · tier ${tierOf(counts[3])}</div></div><div class="spark">${counts.map((c,i)=>`<i title="week of ${weeks[i]}: ${c}" style="height:${Math.round(100*c/mx)}%" class="${i===3?'now':''}"></i>`).join('')}</div><div class="big num">${fmtN(counts[3])}<small>${isF?'/'+f[m]:''}</small></div></div>
      <div class="vs"><span>recovery, 2 weeks <b class="g">${tally[0]} fully</b> <b class="a">${tally[1]} partly</b> <b class="r">${tally[2]} not</b></span><span>avg RIR <b>${avgRir}</b></span><span>lifts <b class="g">${up} up</b> <b class="a">${flat} flat</b></span></div>
      ${lastC?`<div class="vl">${lastC.delta>0?'+':''}${lastC.delta} set · week of ${lastC.week.slice(5)} · ${esc(lastC.why)}</div>`:''}
      <div class="vf"><button class="btn sm ${isF?'gold':''}" data-focus="${esc(m)}">${isF?'Focus':'Make focus'}</button>${isF?`<button class="btn sm" data-ft="${esc(m)}" data-d="-1">−</button><span class="num">${f[m]} sets</span><button class="btn sm" data-ft="${esc(m)}" data-d="1">+</button>`:''}</div></div>`; }).join('')}
  <div class="section" style="margin-top:18px"><h4>Adjustments</h4><div class="list">${(V.log||[]).slice(0,30).map(c=>`<div class="item"><div class="m"><div class="t">${esc(c.muscle)} ${c.delta>0?'+':''}${c.delta} set${c.undone?' · undone':''}</div><div class="s">week of ${c.week} · ${esc(c.why)}</div></div>${!c.undone && c.week===wk?`<button class="btn sm" data-undo="${c.id}">Undo</button>`:''}</div>`).join('')||'<div class="empty">No adjustments yet. The first ones can arrive on Monday, after a week of recovery check-ins.</div>'}</div></div>`;
  const setFocus=nf=>{ plan.data.focus=nf; savePlan(plan); pageVolume(B,T,A); render(); };
  $$('#pageBody [data-focus]').forEach(b=>b.onclick=()=>{ const nf={...f}; const m=b.dataset.focus; if(nf[m]!=null) delete nf[m]; else nf[m]=Math.max(10, plannedWeekly(plan,m)); setFocus(nf); });
  $$('#pageBody [data-ft]').forEach(b=>b.onclick=()=>{ const nf={...f}; const m=b.dataset.ft; nf[m]=Math.max(4,Math.min(30,nf[m]+(+b.dataset.d))); setFocus(nf); });
  $$('#pageBody [data-undo]').forEach(b=>b.onclick=()=>{ undoVolume(b.dataset.undo); pageVolume(B,T,A); render(); });
}
function pageCoach(B,T){
  T.textContent='Coach'; const ns=state.notes||[];
  B.innerHTML = ns.length ? ns.map(n=>`<div class="coachcard ${n.read_at?'read':''}"><div class="k">${new Date(n.created_at).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</div><div class="t">${esc(n.title)}</div><div class="b full">${esc(n.body).replace(/\n/g,'<br>')}</div></div>`).join('') : '<div class="empty">No notes yet. The coach writes one every Sunday.</div>';
}

/* ---- settings ---- */
function pageSettings(B,T){
  T.textContent='Settings'; const s=state.settings;
  B.innerHTML=`<div class="section"><h4>Effort scale</h4><div class="segs"><button class="${(s.mode||'rir')==='rir'?'on':''}" data-mode="rir">RIR (reps in reserve)</button><button class="${s.mode==='rpe'?'on':''}" data-mode="rpe">RPE (6–10)</button></div><div class="empty" style="text-align:left;padding:0 0 10px">Optional on every set. Both are stored; the other is derived (RPE = 10 − RIR).</div></div>
    <div class="section"><h4>Rest timer</h4><div class="segs"><button class="${s.restOn?'on':''}" data-rest="on">On</button><button class="${!s.restOn?'on':''}" data-rest="off">Off</button></div><div class="segs">${[60,90,120,150,180,240].map(v=>`<button class="${(s.rest||90)===v?'on':''}" data-restsec="${v}">${v}s</button>`).join('')}</div><div class="empty" style="text-align:left;padding:0 0 6px">Superset rest — used automatically when you alternate two exercises:</div><div class="segs">${[30,45,60,90].map(v=>`<button class="${(s.ssRest||45)===v?'on':''}" data-ssrest="${v}">${v}s</button>`).join('')}</div><div class="empty" style="text-align:left;padding:0 0 10px">Actual rest between sets is always recorded from the clock, timer or not. Supersets are detected from the timestamps (two exercises alternating, or logged within 90 s of each other).</div></div>
    ${isNative()?`<div class="section"><h4>Health Connect</h4><div class="empty" style="text-align:left;padding:0 0 8px">${state.health.avail==='NotInstalled'?'Health Connect is not installed on this phone.':state.health.avail==='NotSupported'?'This phone does not support Health Connect.':state.health.granted?'Connected. Steps, workouts, sleep, heart rate and weight are read every time the app opens.':'Not connected yet.'}${state.health.lastSync?' Last read '+new Date(state.health.lastSync).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'.':''}</div><div class="segs"><button id="hcSync">Read now (30 days)</button><button id="hcOpen">Open Health Connect</button></div></div>`:''}
    <div class="section"><h4>Alerts</h4><div class="empty" style="text-align:left;padding:0 0 8px">When the rest timer ends.</div>
      <div class="segs">${Object.keys(VIB).map(k=>`<button class="${alertSettings().pattern===k?'on':''}" data-vib="${k}">${k}</button>`).join('')}</div>
      <div class="empty" style="text-align:left;padding:0 0 4px">Rest sound:</div>
      <div class="segs">${Object.keys(SOUNDS).map(k=>`<button class="${alertSettings().restSound===k?'on':''}" data-rsnd="${k}">${k}</button>`).join('')}</div>
      <div class="segs"><button class="${alertSettings().notify?'on':''}" data-ntf="1">Notification on</button><button class="${!alertSettings().notify?'on':''}" data-ntf="0">Notification off</button><button id="alertTest">Test rest alert</button></div>
      <div class="empty" style="text-align:left;padding:8px 0 4px"><b>When you hit a PR.</b> Buzz:</div>
      <div class="segs">${Object.keys(VIB).map(k=>`<button class="${alertSettings().pr===k?'on':''}" data-prv="${k}">${k}</button>`).join('')}</div>
      <div class="empty" style="text-align:left;padding:0 0 4px">PR sound:</div>
      <div class="segs">${Object.keys(SOUNDS).map(k=>`<button class="${alertSettings().prSound===k?'on':''}" data-psnd="${k}">${k}</button>`).join('')}<button id="prTest">Test PR</button></div>
      <div class="empty" style="text-align:left;padding:0 0 10px">Notifications let the alert reach you when the screen is off or you're in another app. ${('Notification' in window)?'Permission: '+Notification.permission:'Not supported on this browser.'}</div></div>
    <div class="section"><h4>Sync</h4><div class="list"><div class="item"><div class="m"><div class="t">${state.online?'Online':'Offline'}</div><div class="s">${state.queue.length} pending · last sync ${state.lastSync?new Date(state.lastSync).toLocaleString():'never'} · ${state.sets.length} sets local</div></div><button class="btn sm" id="syncNow">Sync now</button></div></div></div>
    <div class="section"><h4>Session</h4><div class="list"><div class="item"><div class="m"><div class="t">${state.session?('Open: '+esc(state.session.dayName)+' · '+state.session.date):'No open session'}</div><div class="s">Sessions start on your first set and end at your last. A gap over an hour starts a new one.</div></div>${state.session?'<button class="btn sm red" id="discard">Discard</button>':''}</div></div></div>
    <div class="section"><h4>Today's tweaks</h4><div class="list"><div class="item"><div class="m"><div class="t">${Object.keys(s.swaps).length} swaps · ${Object.keys(s.extra[todayISO()]||{}).reduce((a,k)=>a+(s.extra[todayISO()][k]||[]).length,0)} added exercises · ${Object.keys(s.setsOv[todayISO()]||{}).length} set adjustments</div><div class="s">Swaps stay until reset; added exercises and set adjustments are for today only.</div></div><button class="btn sm" id="resetSwaps">Reset swaps</button></div></div></div>
    <div class="section"><h4>Diet targets</h4><div class="list"><div class="item"><div class="m"><div class="t">${dietTargets().kcal.toLocaleString()} kcal · ${dietTargets().protein} g protein</div><div class="s">Maintenance now; the coach moves these with the phase.</div></div><button class="btn sm" id="dietEdit">Edit</button></div></div></div>
    <div class="section"><h4>Export</h4><div class="list"><div class="item"><div class="m"><div class="t">Copy everything as JSON</div><div class="s">${state.sets.length} sets, ${state.workouts.length} sessions, ${state.plans.length} plans</div></div><button class="btn sm" id="exportBtn">Copy</button></div></div></div>
    <div class="section"><h4>Access</h4><div class="list"><div class="item"><div class="m"><div class="t">Key on this phone</div><div class="s">Remove it to lock the app here.</div></div><button class="btn sm red" id="lock">Lock</button></div></div></div>`;
  $$('#pageBody [data-mode]').forEach(b=>b.onclick=()=>{ s.mode=b.dataset.mode; persist(); pageSettings(B,T); });
  $$('#pageBody [data-rest]').forEach(b=>b.onclick=()=>{ s.restOn=b.dataset.rest==='on'; persist(); pageSettings(B,T); });
  $$('#pageBody [data-restsec]').forEach(b=>b.onclick=()=>{ s.rest=+b.dataset.restsec; persist(); pageSettings(B,T); });
  $$('#pageBody [data-ssrest]').forEach(b=>b.onclick=()=>{ s.ssRest=+b.dataset.ssrest; persist(); pageSettings(B,T); });
  const setA=patch=>{ s.alerts={...alertSettings(),...patch}; persist(); pageSettings(B,T); };
  $$('#pageBody [data-vib]').forEach(b=>b.onclick=()=>{ setA({pattern:b.dataset.vib}); buzz(b.dataset.vib); });
  $$('#pageBody [data-prv]').forEach(b=>b.onclick=()=>{ setA({pr:b.dataset.prv}); buzz(b.dataset.prv); });
  const hs=$('#hcSync'); if(hs) hs.onclick=()=>healthSync(30).then(()=>{ toast('Health Connect read'); pageSettings(B,T); }).catch(e=>toast('Read failed: '+(e.message||e)));
  const ho=$('#hcOpen'); if(ho) ho.onclick=()=>{ const hc=HC(); if(hc) hc.openHealthConnectSetting(); };
  $$('#pageBody [data-rsnd]').forEach(b=>b.onclick=()=>{ setA({restSound:b.dataset.rsnd}); play(b.dataset.rsnd); });
  $$('#pageBody [data-psnd]').forEach(b=>b.onclick=()=>{ setA({prSound:b.dataset.psnd}); play(b.dataset.psnd); });
  $('#prTest').onclick=()=>firePR();
  $$('#pageBody [data-ntf]').forEach(b=>b.onclick=async()=>{ if(b.dataset.ntf==='1'){ const r=await askNotify(); if(r!=='granted'){ toast(r==='unsupported'?'Not supported here':'Permission not given'); setA({notify:false}); return; } } setA({notify:b.dataset.ntf==='1'}); });
  $('#alertTest').onclick=()=>fireRestAlert();
  $('#syncNow').onclick=()=>fullSync().then(()=>pageSettings(B,T));
  const d=$('#discard'); if(d) d.onclick=()=>{ if(!confirm('Discard the open session? Logged sets stay in history.')) return; state.session=null; state.viewDay=null; persist(); render(); pageSettings(B,T); };
  $('#resetSwaps').onclick=()=>{ s.swaps={}; persist(); render(); pageSettings(B,T); };
  $('#exportBtn').onclick=async()=>{ const data={exported:new Date().toISOString(),exercises:state.exercises,plans:state.plans,workouts:state.workouts,sets:state.sets.map(({_local,...x})=>x)}; try{ await navigator.clipboard.writeText(JSON.stringify(data)); toast('Copied '+state.sets.length+' sets'); }catch(e){ toast('Clipboard blocked'); } };
  $('#dietEdit').onclick=()=>{ const t=dietTargets(); modal('Diet targets', `<div class="form"><div class="row"><label>Calories<input id="dtK" type="number" value="${t.kcal}"></label><label>Protein g<input id="dtP" type="number" value="${t.protein}"></label></div></div>`, [{t:'Cancel'},{t:'Save',gold:true,fn:()=>{ s.diet={kcal:+$('#dtK').value||2600, protein:+$('#dtP').value||140}; persist(); pageSettings(B,T); }}]); };
  $('#lock').onclick=()=>{ if(!confirm('Lock IRON on this phone?')) return; try{ localStorage.removeItem('iron.key'); }catch(e){} location.reload(); };
}

/* ================= BOOT ================= */
if(!state.plans.length) state.plans=[{id:DEFAULT_PLAN.id,name:DEFAULT_PLAN.name,data:DEFAULT_PLAN,active:true}];
// one-time purge (2.7): mis-dated photo inserts from the old picker were still sitting in the offline queue and re-posting on every open
if(!state.settings.purgedPhotoQueue){ const n=state.queue.length; state.queue=state.queue.filter(op=>op.t!=='photo.insert'); state.settings.purgedPhotoQueue=true; persist(); if(n!==state.queue.length) console.warn('purged queued photo inserts', n-state.queue.length); }
if(state.session && state.session.date!==todayISO()){ // an unfinished session closes at its LAST SET, not at now
  const id=state.session.workoutId; const ss=state.sets.filter(s=>s.workout_id===id).map(s=>s.created_at).filter(Boolean).sort(); closeSession(ss.length?ss[ss.length-1]:new Date().toISOString());
}
// any device: adopt today's workout as the live session so the phone and the laptop show the same day
if(!state.session){ const w=[...state.workouts].filter(x=>x.date===todayISO()).sort((a,b)=>(b.started_at||'').localeCompare(a.started_at||''))[0]; if(w && !w.finished_at){ let notes={}; try{ notes=w.note?JSON.parse(w.note):{}; }catch(e){} state.session={workoutId:w.id,date:w.date,dayKey:w.day_key,dayName:w.day_name,planId:w.plan_id,notes,startedAt:w.started_at}; persist(); } }
if(!CFG.key){
  $('#main').innerHTML = `<div style="padding:40px 4px"><div class="brand" style="font-size:44px;margin-bottom:6px"><b>IRON</b></div><div style="color:var(--muted);margin-bottom:22px">Private. Paste the access key the coach sent you. It stays on this phone.</div><div class="form"><input id="keyIn" placeholder="access key" autocomplete="off" autocapitalize="off"><button class="btn gold" id="keyGo">Open</button></div></div>`;
  $('#keyGo').onclick=()=>{ const k=$('#keyIn').value.trim(); if(!k) return; try{ localStorage.setItem('iron.key',k); }catch(e){} location.reload(); };
  $('#fab').classList.add('hidden'); setStatus('off','locked');
} else {
  render(); setStatus(state.online?'busy':'off', state.online?'syncing':'offline');
  fullSync().then(()=>{ if(HC()) healthSync(7).catch(e=>console.warn('health sync',e)); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && HC() && Date.now()-state.health.lastSync>30*60*1000) healthSync(3).catch(()=>{}); });
}
if('serviceWorker' in navigator && !isNative()){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
// photos shared from the gallery (Android share sheet → IRON): the native side queues them, the page saves them as progress photos
async function drainSharedPhotos(){ const P=isNative() && Capacitor.Plugins && Capacitor.Plugins.IronShare; if(!P) return; try{ const r=await P.getPending(); const imgs=(r&&r.images)||[]; const D=todayISO(); let added=0, dup=0; const dates=new Set();
  const have=(state.photosMeta||[]).map(m=>new Date(m.taken_at).getTime()); const noTimeDates=new Set((state.photosMeta||[]).filter(m=>(m.note||'').includes('time unknown')).map(m=>m.date)); let dayDup=0;
  for(const it of imgs){ const b64=typeof it==='string'?it:it.b64; const tk=typeof it==='string'?'':(it.taken||''); let when=new Date(); if(tk.startsWith('@')) when=new Date(+tk.slice(1)); else if(tk){ const w=new Date(tk); if(!isNaN(w)) when=w; }
    if(tk && have.some(t=>Math.abs(t-when.getTime())<=3000)){ dup++; continue; }
    if(noTimeDates.has(isoLocal(when))){ dayDup++; continue; }
    const d=isoLocal(when); dates.add(d); const row={id:uid(), date:d, taken_at:when.toISOString(), mime:'image/jpeg', data_b64:b64, note:null}; await savePhoto(row); PHOTO_SRC[row.id]='data:image/jpeg;base64,'+b64; state.photosMeta=[{id:row.id,date:d,taken_at:row.taken_at,note:null}].concat(state.photosMeta||[]); have.push(when.getTime()); added++; if(added%5===0) setStatus('busy', `saving ${added}`); }
  if(added||dup||dayDup){ const ds=[...dates].sort(); toast(`${added} photo${added===1?'':'s'} saved${ds.length?' ('+(ds.length===1?(ds[0]===D?'today':ds[0]):ds[0]+' → '+ds[ds.length-1])+')':''}${dup?' · '+dup+' already there':''}${dayDup?' · '+dayDup+' skipped (day already has photos without a time)':''}${r.skippedVideos?' · '+r.skippedVideos+' video'+(r.skippedVideos===1?'':'s')+' skipped':''}`, true); }
  if(r && r.busy){ setStatus('busy', `importing ${r.done}/${r.queued}`); setTimeout(drainSharedPhotos, 1500); } else if(imgs.length && $('#page').classList.contains('open') && $('#pageTitle').textContent==='Photos') openPage('photos', null, true); }catch(e){ console.warn('share', e); } }
if(isNative()){ setTimeout(drainSharedPhotos, 800); document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') drainSharedPhotos(); }); if(Capacitor.Plugins && Capacitor.Plugins.App){ try{ Capacitor.Plugins.App.addListener('appStateChange', st=>{ if(st.isActive) drainSharedPhotos(); }); }catch(e){} } }
if(isNative() && Capacitor.Plugins && Capacitor.Plugins.App){ try{ Capacitor.Plugins.App.addListener('backButton', ()=>{ if(LAYERS.length) history.back(); else Capacitor.Plugins.App.exitApp(); }); }catch(e){ console.warn('back listener', e); } }
</script>
